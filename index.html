<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawan Coder - Cyber Terminal</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .terminal {
            width: 85%;
            max-width: 500px;
            text-align: left;
            border: 2px solid #00ff00;
            padding: 20px;
            background: rgba(0, 255, 0, 0.05);
            box-shadow: 0 0 20px #00ff00;
            border-radius: 10px;
        }
        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 2px;
            margin-top: 0;
        }
        .console {
            height: 150px;
            overflow-y: auto;
            margin-bottom: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            color: #00ff00;
        }
        .btn-container {
            text-align: center;
        }
        .btn {
            background-color: #00ff00;
            color: #000000;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 10px #00ff00;
            text-transform: uppercase;
        }
        .btn:hover {
            background-color: #00cc00;
            box-shadow: 0 0 20px #00cc00;
        }
        /* Pawan's Photo Card Styling */
        .profile-card {
            display: none;
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
        }
        .my-pic {
            width: 180px;
            height: 180px;
            border-radius: 15px; /* Thoda rounded look ke liye */
            border: 3px solid #00ff00;
            box-shadow: 0 0 15px #00ff00;
            object-fit: cover;
            margin-top: 15px;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="terminal" id="mainTerminal">
        <h1 id="titleText">SYSTEM OVERRIDE</h1>
        
        <div class="console" id="logScreen">
            [SYSTEM] Waiting for authorization...<br>
            [SYSTEM] Click below to Bypass and Enter Network.
        </div>

        <div class="btn-container">
            <button class="btn" id="hackBtn" onclick="startHacking()">Bypass Firewall</button>
        </div>

        <div class="profile-card" id="pawanProfile">
            <img class="my-pic" src="https://i.ibb.co/h1Drx6cc/image.jpg" alt="Pawan">
            <h2 style="color: #ffffff; margin-top: 15px; letter-spacing: 2px;">PAWAN</h2>
            <p style="color: #00ff00; font-size: 1.1rem; margin-bottom: 5px;">[ System Administrator & Coder ]</p>
            <p style="color: #888888; font-size: 0.9rem; font-style: italic;">"Attitude matters, hacking rulez!"</p>
        </div>
    </div>

    <script>
        var lines = [
            "[INFO] Initializing exploit framework...",
            "[INFO] Bypassing firewall security layers...",
            "[SUCCESS] Firewall breached successfully!",
            "[INFO] Injecting root exploit into mainframe...",
            "[SUCCESS] Root access granted!",
            "---------------------------------------",
            "[SYSTEM CENTRAL] ACCESS GRANTED.",
            "[WELCOME] Loading Developer Profile Core... 🚀"
        ];

        var currentLine = 0;

        function startHacking() {
            document.getElementById("hackBtn").style.display = "none";
            var screen = document.getElementById("logScreen");
            screen.innerHTML = "";
            printLog();
        }

        function printLog() {
            if (currentLine < lines.length) {
                var screen = document.getElementById("logScreen");
                screen.innerHTML += lines[currentLine] + "<br>";
                screen.scrollTop = screen.scrollHeight;
                currentLine++;
                setTimeout(printLog, 1000); 
            } else {
                // Hacking finish hote hi photo card show hoga
                setTimeout(function() {
                    document.getElementById("logScreen").style.display = "none";
                    document.getElementById("titleText").innerHTML = "ACCESS GRANTED";
                    document.getElementById("pawanProfile").style.display = "block";
                }, 1500);
            }
        }
    </script>

</body>
</html>
