<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawan Coder - Cyber Terminal</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .terminal {
            width: 85%;
            max-width: 500px;
            text-align: left;
            border: 2px solid #00ff00;
            padding: 20px;
            background: rgba(0, 255, 0, 0.05);
            box-shadow: 0 0 20px #00ff00;
            border-radius: 10px;
        }
        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 2px;
            margin-top: 0;
        }
        .console {
            height: 150px;
            overflow-y: auto;
            margin-bottom: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            color: #00ff00;
        }
        .btn-container {
            text-align: center;
        }
        .btn {
            background-color: #00ff00;
            color: #000000;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 10px #00ff00;
            text-transform: uppercase;
        }
        .btn:hover {
            background-color: #00cc00;
            box-shadow: 0 0 20px #00cc00;
        }
    </style>
</head>
<body>

    <div class="terminal">
        <h1>SYSTEM OVERRIDE</h1>
        
        <div class="console" id="logScreen">
            [SYSTEM] Waiting for authorization...<br>
            [SYSTEM] Click below to Bypass and Enter Network.
        </div>

        <div class="btn-container">
            <button class="btn" id="hackBtn" onclick="startHacking()">Bypass Firewall</button>
        </div>
    </div>

    <script>
        var lines = [
            "[INFO] Initializing exploit framework...",
            "[INFO] Bypassing firewall security layers...",
            "[SUCCESS] Firewall breached successfully!",
            "[INFO] Injecting root exploit into mainframe...",
            "[SUCCESS] Root access granted!",
            "---------------------------------------",
            "[SYSTEM CENTRAL] ACCESS GRANTED.",
            "[REDIRECTING] Entering Pawan's Secret Network... 🚀"
        ];

        var currentLine = 0;

        function startHacking() {
            document.getElementById("hackBtn").style.display = "none";
            var screen = document.getElementById("logScreen");
            screen.innerHTML = "";
            printLog();
        }

        function printLog() {
            if (currentLine < lines.length) {
                var screen = document.getElementById("logScreen");
                screen.innerHTML += lines[currentLine] + "<br>";
                screen.scrollTop = screen.scrollHeight;
                currentLine++;
                setTimeout(printLog, 1000); 
            } else {
                // Hacking khatam hote hi automatic is website par le jayega
                setTimeout(function() {
                    window.location.href = "https://www.instagram.com/lieutenantpawansharma?igsh=MWFkMTR4ejRveDN5Ng=="; 
                }, 1500);
            }
        }
    </script>

</body>
</html>
